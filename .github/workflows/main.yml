name: Health ML Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Requirements
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Pipeline Success
      run: echo "CI/CD Pipeline Working Successfully"